# CLIProxyAPI 默认配置模板（全新安装时由 cmd/main 生成 config.yaml；已有配置永不覆盖）
config-version: 8

server:
  # 空 = 监听所有网卡（IPv4 + IPv6）
  host: ""
  port: __PORT__

# 管理 API / 面板：allow-remote 允许局域网访问；secret-key 即面板登录密钥
management:
  allow-remote: true
  secret-key: "__MANAGEMENT_KEY__"

# 客户端（调用方）密钥：任何支持 OpenAI/Gemini/Claude 格式的客户端用它访问 /v1
access:
  api-keys:
    - "sk-cliproxyapi"

# 账号凭据存储目录（OAuth 登录后的凭据都放这里，升级不丢）
oauth:
  auth-dir: "__AUTH_DIR__"
  # Antigravity 风控规避（默认启用）：系统提示词里出现特定指纹词组合时，上游会返回
  # 假 429（RESOURCE_EXHAUSTED，与真实配额无关）。代理在转发前用零宽字符把下方词表
  # 切开脱敏：模型读到的语义不变，上游风控正则失配。遇到新触发词在管理面板追加即可。
  providers:
    antigravity:
      sensitive-words:
        - "Hermes Agent"
        - "Nous Research"

# 应用日志：写到文件（面板「日志」页需要），总量上限 200MB
observability:
  logs:
    logging-to-file: true
    logs-max-total-size-mb: 200
